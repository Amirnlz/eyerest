name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate for releases: static checks, tests, build and installers on every OS.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Logic tests and UI (jsdom) tests: both run under vitest.
      - name: Unit and UI tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  # Real-app UI flows. Separate from `check` so a flaky display or a stale e2e spec cannot
  # block packaging; it still reports red on pull requests.
  e2e:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Linux has no display on the runner: run the real app under xvfb.
      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: E2E
        if: runner.os != 'Linux'
        run: npx playwright test

      # Gallery checks read computed styles in plain Chromium. One OS is enough: they test CSS,
      # not the platform.
      - name: Install Chromium for the gallery (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Gallery checks (Linux)
        if: runner.os == 'Linux'
        run: npm run e2e:gallery

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Publishes a GitHub Release when a `v*` tag passes every `check` job.
  # Tag format: v<package.json version>, e.g. v0.1.0.
  release:
    name: Publish release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: dist-installers
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-installers/* \
            --title "$TAG" --generate-notes --verify-tag
